appId: io.github.aidind.jot
productName: Jot
directories:
  buildResources: resources
files:
  - out/**
  - resources/**
win:
  target:
    - nsis
  # A multi-size .ico, not the PNG: electron-builder would downscale one 512px
  # bitmap to 16px, which is what the small drawing in scripts/generate-icon.mjs
  # exists to avoid.
  icon: resources/icon.ico
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
publish:
  provider: github
  owner: AidinD
  repo: jot
  releaseType: release
